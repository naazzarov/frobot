services:
  frobot:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      FROBOT_OWNER_TOKEN: ${FROBOT_OWNER_TOKEN:?Set FROBOT_OWNER_TOKEN in .env before starting}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    volumes:
      - frobot-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  frobot-data:
